[bar.default]
auto_hide = true
background_opacity = 0.4999999888241291
center = [ "clock", "bar" ]
end = [ "media", "tray", "widget", "volume" ]
margin_ends = 0
radius = 0
reserve_space = false
start = [ "launcher", "wallpaper", "workspaces", "clipboard", "notes", "widget_2" ]
thickness = 30

[brightness]
enable_ddcutil = true

[control_center]
hidden_tabs = [ "power", "bluetooth" ]

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "session"

[dock]
auto_hide = true
background_opacity = 0.4999999888241291
cross_axis_padding = 3
enabled = true
icon_size = 40
launcher_position = "start"
magnification_scale = 1.2000000029802322
main_axis_padding = 17
reserve_space = false

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 360.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 180.0

[location]
address = "Campina Grande - PB"

[lockscreen]
transition = [ "disc", "fade", "honeycomb", "wipe", "zoom" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@DP-2", "lockscreen-login-box@DP-3" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 898.0
    output = "DP-2"
    placement_height = 1080.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 540.0
    cy = 1596.4444580078125
    output = "DP-3"
    placement_height = 1920.0
    placement_width = 1080.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 1920.0
    cy = 1341.0
    output = "HDMI-A-1"
    placement_height = 2160.0
    placement_width = 3840.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[plugin_settings."noctalia/mpvpaper"]
run_as_systemd = true
video_directory = "/home/victor/Imagens/wallpapers/animated"

[plugin_settings."noctalia/notes"]
extension = ".txt"
notes_dir = "/home/victor/Documentos/notes"

[plugins]
enabled = [ "noctalia/notes", "oldirtty/color_picker", "noctalia/umbriel-companion" ]

[shell]
avatar_path = "/home/victor/Imagens/icons/avatar.jpeg"
clipboard_history_max_entries = 40
font_family = "JetBrainsMono Nerd Font Mono"
password_style = "random"
polkit_agent = true
screen_time_enabled = true

    [shell.launcher]
    categories = false
    layout = "simple"

    [shell.panel]
    session_position = "top_center"
    transparency_mode = "soft"

    [shell.screenshot]
    confirm_region = true

[theme]
builtin = "Kanagawa"
community_palette = "Everforest Material"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kitty", "niri", "qt", "umbriel" ]
    community_ids = [ "micro", "obsidian", "zed", "yazi" ]

[wallpaper]
directory = "/home/victor/Imagens/wallpapers"
transition = [ "disc", "fade", "honeycomb", "wipe", "zoom" ]

    [wallpaper.default]
    path = "/home/victor/Imagens/wallpapers/1.jpg"

    [wallpaper.last]
    path = "/home/victor/Imagens/wallpapers/1.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/victor/Imagens/wallpapers/1.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/victor/Imagens/wallpapers/1.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/victor/Imagens/wallpapers/1.jpg"

[widget.bar]
type = "noctalia/umbriel-companion:bar"

[widget.battery]
enabled = false

[widget.bluetooth]
enabled = false

[widget.brightness]
enabled = false

[widget.launcher]
enabled = false

[widget.network]
enabled = false

[widget.notes]
type = "noctalia/notes:notes"

[widget.notifications]
enabled = false

[widget.session]
enabled = false

[widget.sysmon]
stat = "ram_used"

[widget.tray]
drawer = true

[widget.wallpaper]
enabled = false

[widget.widget]
type = "alexander/screen-toolkit:widget"

[widget.widget_2]
